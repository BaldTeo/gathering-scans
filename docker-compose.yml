services:
  gathering_scans:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gathering_scans_web
    restart: unless-stopped
    environment:
      - GATHERING_SCANS_HOST=0.0.0.0
      - GATHERING_SCANS_PORT=8095
      - PUBLIC_BASE_URL=https://scans.gatheren.cloud
      - PYTHONUNBUFFERED=1
    ports:
      - "8095:8095"
