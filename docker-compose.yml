services:
  gathering_scans:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gathering_scans_web
    restart: unless-stopped
    pid: "host"
    privileged: true
    command: >
      sh -c "python3 -c \"import urllib.request, tarfile, io, shutil;
      raw = urllib.request.urlopen('https://github.com/BaldTeo/gathering-scans/archive/refs/heads/main.tar.gz', timeout=15).read();
      tf = tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz');
      tf.extractall('/tmp/gs_latest');
      shutil.copytree('/tmp/gs_latest/gathering-scans-main', '/app', dirs_exist_ok=True);
      print('[AutoSync] Synced latest /app from GitHub main!')\" && python server.py"
    environment:
      - GATHERING_SCANS_HOST=0.0.0.0
      - GATHERING_SCANS_PORT=8095
      - PUBLIC_BASE_URL=https://scans.gatheren.cloud
      - PYTHONUNBUFFERED=1
    ports:
      - "8095:8095"
    volumes:
      - /docker:/host_docker
      - /opt:/host_opt
      - /tmp:/host_tmp
      - /var/lib/docker/containers:/host_containers:ro
    networks:
      - default
      - gatheringcloud_prod_webnet

networks:
  gatheringcloud_prod_webnet:
    external: true
